name: "TIS Screen Controller"
description: "Drives the ST7789 display using spidev and gpiod."
version: "2.0.0"
slug: "tis_display"
init: false
arch:
  - aarch64
startup: application
boot: auto
devices:
  - /dev/spidev0.0:/dev/spidev0.0:rwm
  - /dev/fb0:/dev/fb0:rwm
gpio: true
options: {}
schema: {}
map:
  - config:rw
